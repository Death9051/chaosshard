name: Тест на сервере

# Запускается вручную, после пачки изменений: настоящий сервер Forge 1.12.2 с модом и его соседями,
# сам запускает /oh autotest, отчёт и лог — в ветку ci-logs (папка test/). Берёт последний собранный jar.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: servertest
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8

      - name: Мод из ветки ci-logs
        run: |
          git fetch origin ci-logs
          mkdir -p /tmp/jar
          for f in $(git ls-tree --name-only origin/ci-logs | grep '^chaosshard-.*\.jar$' | grep -v -- '-dev\|-sources'); do git show "origin/ci-logs:$f" > "/tmp/jar/$f"; done
          ls -la /tmp/jar

      - name: Кэш сервера Forge
        uses: actions/cache@v4
        with:
          path: server-base
          key: forge-1.12.2-14.23.5.2860-v1

      - name: Установить сервер Forge
        run: |
          if [ ! -f server-base/forge-1.12.2-14.23.5.2860.jar ]; then
            mkdir -p server-base && cd server-base
            curl -sfL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-installer.jar
            java -jar installer.jar --installServer > install.log 2>&1 || (tail -50 install.log; exit 1)
            rm -f installer.jar
            ls
          fi

      - name: Моды
        run: |
          rm -rf server && cp -r server-base server && mkdir -p server/mods
          cp /tmp/jar/*.jar server/mods/
          while read -r slug pid fid; do
            [ -z "$slug" ] && continue
            case "$slug" in \#*) continue;; esac
            url="https://curse.cleanroommc.com/curse/maven/${slug}-${pid}/${fid}/${slug}-${pid}-${fid}.jar"
            curl -sfL -o "server/mods/${slug}.jar" "$url" && echo "ok $slug" || echo "FAIL $slug"
          done < .github/test-mods.txt
          ls -la server/mods

      - name: Прогон
        run: |
          cd server
          echo "eula=true" > eula.txt
          cat > server.properties <<'P'
          online-mode=false
          level-seed=chaosshard
          spawn-protection=0
          max-tick-time=-1
          view-distance=6
          allow-nether=true
          P
          sed -i 's/^ *//' server.properties
          set +e
          timeout 1800 java -Xmx5G -Dchaosshard.autotest=true -Dfml.queryResult=confirm -jar forge-1.12.2-14.23.5.2860.jar nogui > console.log 2>&1
          echo "код выхода: $?" >> console.log
          set -e
          tail -30 console.log
          ls

      - name: Отчёт в ci-logs
        if: always()
        run: |
          mkdir -p /tmp/t
          cp server/chaosshard-autotest.txt /tmp/t/ 2>/dev/null || echo "отчёта нет — см. console.log" > /tmp/t/chaosshard-autotest.txt
          cp server/chaosshard-selftest.txt /tmp/t/ 2>/dev/null || true
          cp server/chaosshard-registry.txt /tmp/t/ 2>/dev/null || true
          cp server/console.log /tmp/t/ 2>/dev/null || true
          cp server/logs/latest.log /tmp/t/latest.log 2>/dev/null || true
          cp server/crash-reports/*.txt /tmp/t/ 2>/dev/null || true
          echo "${{ job.status }} ${{ github.event.workflow_run.head_sha || github.sha }}" > /tmp/t/status.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin ci-logs
            git checkout -f -B ci-logs origin/ci-logs
            rm -rf test && mkdir -p test && cp /tmp/t/* test/
            git add -A test
            git commit -m "Тест на сервере ${{ github.event.workflow_run.head_sha || github.sha }}" || true
            git push origin ci-logs && break
            sleep 5
          done
