name: Сведения о модах сборки

# Ручной запуск: скачивает jar модов через curse maven и выкладывает в ветку mod-info
# их языковые файлы, рецепты и список классов — чтобы писать квесты и совместимость без самой игры.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/mod-info.txt']

permissions:
  contents: write

jobs:
  info:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Скачать и разобрать моды
        run: |
          mkdir -p /tmp/out
          while read -r slug pid fid; do
            [ -z "$slug" ] && continue
            case "$slug" in \#*) continue;; esac
            url="https://curse.cleanroommc.com/curse/maven/${slug}-${pid}/${fid}/${slug}-${pid}-${fid}.jar"
            dir="/tmp/out/${slug}"
            mkdir -p "$dir"
            if curl -sfL -o /tmp/mod.jar "$url"; then
              echo "ok $slug" >> /tmp/out/status.txt
              unzip -l /tmp/mod.jar > "$dir/files.txt" || true
              unzip -o -q /tmp/mod.jar 'assets/*/lang/en_us.lang' 'assets/*/lang/ru_ru.lang' 'assets/*/recipes/*' 'assets/*/advancements/*' -d "$dir" 2>/dev/null || true
              unzip -o -q /tmp/mod.jar 'mcmod.info' -d "$dir" 2>/dev/null || true
              mkdir -p "/tmp/out/jars"
              cp /tmp/mod.jar "/tmp/out/jars/${slug}.jar"
            else
              echo "FAIL $slug $url" >> /tmp/out/status.txt
            fi
          done < .github/mod-info.txt
      - name: В ветку mod-info
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan mod-info
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/* .
          git add -A
          git commit -m "Сведения о модах ${{ github.sha }}"
          git push -f origin mod-info
