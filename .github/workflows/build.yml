name: Сборка мода

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Версия образа закреплена: ubuntu-latest с 19.10.2026 переезжает на Ubuntu 26
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Java 25 для Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Сборка
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace build 2>&1 | tee build.log

      - name: Готовый jar
        uses: actions/upload-artifact@v6
        with:
          name: chaosshard-jar
          path: build/libs/*.jar

      # Журнал сборки в ветку ci-logs: его можно прочитать через git,
      # даже когда страницы логов Actions недоступны.
      - name: Журнал сборки в ветку ci-logs
        if: always()
        run: |
          [ -f build.log ] || echo "build.log не создан" > build.log
          mkdir -p /tmp/ci && cp build.log /tmp/ci/build.log
          cp build/libs/*.jar /tmp/ci/ 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/ci/status.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          rm -f build.log
          git fetch origin ci-logs:refs/remotes/origin/ci-logs || true
          if git rev-parse --verify origin/ci-logs >/dev/null 2>&1; then
            git checkout -f -B ci-logs origin/ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf . >/dev/null 2>&1 || true
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/ci/* .
          git add -A
          git commit -m "Журнал сборки ${{ github.sha }}" || true
          git push origin ci-logs
